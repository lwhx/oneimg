name: Test OneImg API & frontend
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go unit tests
        run: go test ./backend/...
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
  docker-smoke:
    name: Build and smoke-test runtime image
    runs-on: ubuntu-latest
    needs: [go-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build a local amd64 runtime image (no registry push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: oneimg:ci-smoke
          cache-from: type=gha,scope=oneimg
          cache-to: type=gha,scope=oneimg,mode=max
      - name: Verify app startup and HTTP response
        run: |
          docker run -d --name oneimg-ci -p 127.0.0.1:18080:8080 \
            -e APP_URL=http://127.0.0.1:18080 oneimg:ci-smoke
          for i in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/settings/login >/dev/null 2>&1; then
              echo "OneImg started successfully"
              exit 0
            fi
            sleep 2
          done
          docker logs oneimg-ci
          exit 1
      - name: Stop smoke-test container
        if: always()
        run: docker rm -f oneimg-ci || true
