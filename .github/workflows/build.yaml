name: Publish lightweight OneImg image (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ghcr-oneimg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Native amd64 / arm64 builds and GHCR publish
    # Compile on native ARM runners instead of running Go CGO/WebP under QEMU.
    # The Docker-maintained workflow creates the combined manifest after both
    # native builds succeed, while the final runtime stays Alpine-only.
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      distribute: true
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      context: .
      file: ./Dockerfile
      build-args: |
        VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      cache: true
      cache-mode: max
      cache-scope: oneimg
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=sha,prefix=sha-,format=short
        type=ref,event=tag
      meta-labels: |
        org.opencontainers.image.title=OneImg
        org.opencontainers.image.description=Self-hosted image hosting with multiple storage backends
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      set-meta-labels: true
      sign: 'false'
      sbom: false
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
